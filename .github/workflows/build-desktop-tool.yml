name: PR11 packaged platform validation

on:
  workflow_dispatch:
    inputs:
      build-run-id:
        description: Completed build-desktop-tool run containing PR11 artifacts
        required: true
        type: string
      replacement-run-id:
        description: Second independently compiled build of the same PR and test version
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  validate:
    name: Packaged behavior (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            filename: autofill-windows.exe
          - os: macos-latest
            target: macos-arm
            filename: autofill-macos-arm.command
          - os: macos-15-intel
            target: macos-intel
            filename: autofill-macos-intel.command
          - os: ubuntu-22.04
            target: linux
            filename: autofill-linux.bin
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install terminal test support
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            python -m pip install pywinpty
          else
            python -m pip install pexpect
          fi
      - name: Download the actual PR build artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download '${{ inputs.build-run-id }}' --repo '${{ github.repository }}' --name '${{ matrix.target }} Unsigned Build' --dir binary
          gh run download '${{ inputs.replacement-run-id }}' --repo '${{ github.repository }}' --name '${{ matrix.target }} Unsigned Build' --dir replacement
      - name: Exercise native packaged update behavior
        shell: bash
        run: python platform-testing/check_bundle.py 'binary/${{ matrix.filename }}' --replacement 'replacement/${{ matrix.filename }}'
      - name: Save transcripts and machine-readable results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: platform-validation-${{ matrix.target }}
          path: platform-results/
