# VALIDATION ONLY: never merge this replacement workflow into production.
name: Final DTC 1.2.6 binary verification
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  validate:
    name: Final release binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            filename: autofill-windows.exe
          - os: macos-latest
            target: macos-arm
            filename: autofill-macos-arm.command
          - os: macos-15-intel
            target: macos-intel
            filename: autofill-macos-intel.command
          - os: ubuntu-22.04
            target: linux
            filename: autofill-linux.bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify final build provenance before download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ matrix.target }} Unsigned Build
        run: |
          set -euo pipefail
          mkdir -p final-results
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/40118782173" > final-results/build-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/40118782173/jobs?per_page=100" > final-results/build-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/dtc-v1.2.6" > final-results/build-tag.json
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('final-results')
          run = json.loads((root / 'build-run.json').read_text())
          assert run['id'] == 40118782173 and run['run_attempt'] == 1
          assert run['path'] == '.github/workflows/build-desktop-tool.yml'
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['head_sha'] == 'a784ac1c70d422dc55e93a1c8ce07e8ee44fa5aa'
          assert run['head_branch'] == 'dtc-v1.2.6' and run['event'] == 'workflow_dispatch'
          tag = json.loads((root / 'build-tag.json').read_text())
          assert tag['object']['sha'] == run['head_sha'] and tag['object']['type'] == 'commit'
          jobs = json.loads((root / 'build-jobs.json').read_text())['jobs']
          expected = {f'Test on {os}' for os in ['ubuntu-latest','macos-latest','macos-15-intel','windows-latest']}
          expected |= {f'Build {target}' for target in ['linux','windows','macos-arm','macos-intel']}
          assert {j['name'] for j in jobs if j['conclusion'] == 'success'} == expected
          assert all(j['conclusion'] == ('skipped' if j['name'] == 'validate' else 'success') for j in jobs)
          PY
          gh run download 40118782173 --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT" --dir binary
      - uses: ./.github/actions/setup-desktop-tool
        with:
          group: dev
      - uses: ./.github/actions/setup-ghostscript
        if: runner.os == 'Linux'
      - name: Validate actual final native binary
        shell: bash
        env:
          DESKTOP_FILENAME: ${{ matrix.filename }}
          DESKTOP_TARGET: ${{ matrix.target }}
          PYTHONUTF8: "1"
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            dbus-run-session -- uv run --project desktop-tool --locked --no-default-groups --group dev python desktop-tool/tests/check_final_release_binary.py "binary/$DESKTOP_FILENAME" "$DESKTOP_TARGET" 2>&1 | tee final-results/native-transcript.log
          else
            uv run --project desktop-tool --locked --no-default-groups --group dev python desktop-tool/tests/check_final_release_binary.py "binary/$DESKTOP_FILENAME" "$DESKTOP_TARGET" 2>&1 | tee final-results/native-transcript.log
          fi
      - name: Check the actual final Linux bundle on clean Debian 12
        if: runner.os == 'Linux'
        shell: bash
        env:
          DESKTOP_FILENAME: ${{ matrix.filename }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/validation:ro" \
            -v "$RUNNER_TEMP/desktop-ghostscript:$RUNNER_TEMP/desktop-ghostscript:ro" \
            -v "$HOME/.mpc-autofill:/root/.mpc-autofill:ro" \
            -e "PATH=$RUNNER_TEMP/desktop-ghostscript/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            -e "DESKTOP_FILENAME=$DESKTOP_FILENAME" debian:12-slim bash -euc '
              apt-get update
              apt-get install --yes ca-certificates python3-pil dbus-daemon libfontconfig1
              test "$(/validation/binary/"$DESKTOP_FILENAME" --version)" = "MPC Autofill 1.2.6 (bwsinger/mpc-autofill)"
              /validation/binary/"$DESKTOP_FILENAME" --check-tls
              /validation/binary/"$DESKTOP_FILENAME" --help
              dbus-run-session -- python3 /validation/desktop-tool/tests/smoke_pdf_export.py /validation/binary/"$DESKTOP_FILENAME"
            ' 2>&1 | tee final-results/clean-debian12.log
      - name: Save final binary test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: final-release-validation-${{ matrix.target }}
          path: final-results
