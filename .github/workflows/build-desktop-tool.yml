name: Ghostscript native upgrade acceptance
on:
  workflow_dispatch:
    inputs:
      windows-only:
        description: Retry Windows installer acceptance without repeating completed Mac/Linux runs
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  upgrade:
    name: Real GS upgrade on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.windows-only && '["windows-latest"]' || '["windows-latest", "macos-latest", "macos-15-intel", "ubuntu-22.04"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-desktop-tool
        with:
          group: dev
      - name: Isolated failure boundary tests
        shell: bash
        working-directory: desktop-tool
        run: uv run --locked --group dev python -m pytest tests/test_ghostscript_upgrade_failures.py tests/test_modernization.py tests/test_desktop_tool.py tests/test_pdf_cache.py -k 'ghostscript or installer or unsupported or old_path' -v
      - name: Install real old Linux distro package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes ghostscript
          dpkg-query -W ghostscript libgs9
      - name: Prove real apt attempt cannot falsely pass the version floor
        if: runner.os == 'Linux'
        shell: bash
        working-directory: desktop-tool
        run: uv run --locked --group dev python tests/accept_ghostscript_upgrade.py linux-old 2>&1 | tee "$RUNNER_TEMP/linux-old.log"
      - uses: ./.github/actions/setup-ghostscript
        if: runner.os == 'Linux'
      - name: Real native installer upgrade and PDF acceptance
        shell: bash
        working-directory: desktop-tool
        run: |
          set -eo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            dbus-run-session -- uv run --locked --group dev python tests/accept_ghostscript_upgrade.py linux-upgraded 2>&1 | tee "$RUNNER_TEMP/upgrade.log"
          else
            uv run --locked --group dev python tests/accept_ghostscript_upgrade.py native 2>&1 | tee "$RUNNER_TEMP/upgrade.log"
          fi
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gs-upgrade-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/gs-upgrade-evidence
            ${{ runner.temp }}/upgrade.log
            ${{ runner.temp }}/linux-old.log
