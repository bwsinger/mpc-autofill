name: Desktop tool tests
on:
  pull_request:
    paths:
      - "desktop-tool/**"
      - ".github/actions/test-desktop-tool/**"
      - ".github/workflows/test-desktop-tool.yml"
  push:
    paths:
      - "desktop-tool/**"
      - ".github/actions/test-desktop-tool/**"
      - ".github/workflows/test-desktop-tool.yml"
  workflow_dispatch:
jobs:
  offline:
    if: github.event_name == 'pull_request'
    name: Offline desktop tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
    #          - os: ubuntu-latest  # https://github.com/browser-actions/setup-edge/issues/516
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/test-desktop-tool
        with:
          pytest-marker: not google_drive
  google-drive:
    if: github.event_name != 'pull_request'
    name: Google Drive integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/test-desktop-tool
        with:
          google-drive-api-key: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
          pytest-marker: google_drive
