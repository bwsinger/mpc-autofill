name: Desktop tool tests
description: Test the MPC Autofill CLI / desktop tool
inputs:
  google-drive-api-key:
    description: Service-account JSON, required only for Google Drive tests
    required: false
  pytest-marker:
    description: Pytest marker expression; empty runs all tests
    required: false
    default: ""
runs:
  using: composite
  steps:
    # not sure atm how to set up brave browser on github actions
    - uses: browser-actions/setup-chrome@latest
      with:
        chrome-version: stable
    # - uses: browser-actions/setup-edge@latest
    #   with:
    #     edge-version: beta
    - name: Fix macOS Chromedriver
      if: runner.os == 'macOS'
      run: |
        rm /usr/local/bin/chromedriver
      shell: bash
    - name: Set up Python 3.13
      uses: actions/setup-python@v6
      with:
        python-version: 3.13
    - name: Install Python dependencies
      working-directory: desktop-tool
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      shell: bash
    - name: Write Google Drive API credentials to file
      if: inputs.google-drive-api-key != ''
      uses: jsdaniell/create-json@v1.2.3
      with:
        name: "client_secrets.json"
        json: ${{ inputs.google-drive-api-key }}
        dir: "desktop-tool/"
    - name: Validate Google Drive credentials
      if: inputs.pytest-marker != 'not google_drive'
      working-directory: desktop-tool
      run: python -c "from src.io import validate_google_drive_access; validate_google_drive_access('1oigI6wz0zA--pNMuExKTs40kBNH6VRP_')"
      shell: bash
    - name: Run tests
      working-directory: desktop-tool
      run: pytest . -m "${{ inputs.pytest-marker }}"
      shell: bash
